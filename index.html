<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Entre Redes - Portal Oficial</title>
  
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="https://api.iconify.design/fluent-emoji-flat:volleyball.svg">
  <link rel="apple-touch-icon" href="https://api.iconify.design/fluent-emoji-flat:volleyball.svg">
  
  <meta name="theme-color" content="#00bf63">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Entre Redes">

  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      height: 100%; 
      width: 100%; 
      overflow: hidden; 
      background-color: #0d1117; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    }
    
    iframe { 
      width: 100%; 
      height: 100%; 
      border: none; 
      display: block;
    }

    /* BOTÓN FLOTANTE ARRIBA A LA IZQUIERDA */
    #btnFloatingInstall {
      position: fixed;
      top: 12px;
      left: 12px;
      background: #161b22;
      color: #00bf63;
      border: 2px solid #00bf63;
      border-radius: 30px;
      padding: 6px 14px;
      font-weight: 800;
      font-size: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.7);
      z-index: 999999;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.2s ease;
    }

    #btnFloatingInstall:active {
      transform: scale(0.95);
    }

    /* VENTANA MODAL DE INSTRUCCIONES */
    #pwaInstructionsModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 1000000;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .modal-card {
      background: #161b22;
      border: 2px solid #00bf63;
      border-radius: 18px;
      padding: 24px;
      max-width: 340px;
      text-align: center;
      color: #ffffff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9);
    }

    .modal-card h3 {
      margin: 0 0 10px 0;
      color: #00bf63;
      font-size: 18px;
    }

    .modal-card p {
      font-size: 13px;
      color: #c9d1d9;
      line-height: 1.5;
      margin-bottom: 20px;
      text-align: left;
    }

    .modal-card button {
      background: #00bf63;
      color: #000;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: 800;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>

  <!-- BOTÓN FLOTANTE ARRIBA A LA IZQUIERDA -->
  <button id="btnFloatingInstall">
    <span>🏐</span>
    <span>Instalar App</span>
  </button>

  <!-- VENTANA MODAL DE INSTRUCCIONES -->
  <div id="pwaInstructionsModal">
    <div class="modal-card">
      <h3>Instalar Entre Redes</h3>
      <p id="modalInstructionsText">
        Cargando opciones...
      </p>
      <button onclick="cerrarModal()">Entendido</button>
    </div>
  </div>

  <!-- IFRAME CON LA APP DE GOOGLE -->
  <iframe 
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbzVFhDthR8fFK7sakUg2SYGmtkeQkN-eloAlapDD2Pnh_PjH2lapPFXSAtSyiDlSJxuAg/exec" 
    allow="geolocation; microphone; camera; clipboard-write; encrypted-media; autoplay"
    sandbox="allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts allow-top-navigation-by-user-activation">
  </iframe>

  <script>
    let deferredPrompt;
    const btnInstall = document.getElementById('btnFloatingInstall');
    const modal = document.getElementById('pwaInstructionsModal');
    const modalText = document.getElementById('modalInstructionsText');

    // Ocultar botón si ya está abierta como App nativa
    const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
    if (isStandalone) {
      btnInstall.style.display = 'none';
    }

    // Registrar Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    // Capturar el evento automático de Android/Chrome
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    // Acción al tocar el botón arriba a la izquierda
    btnInstall.addEventListener('click', async () => {
      if (deferredPrompt) {
        // Si el navegador tiene el evento listo, lanza la instalación directa
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          btnInstall.style.display = 'none';
        }
        deferredPrompt = null;
      } else {
        // Si el navegador no lo lanzó automático (como pasa en tu celu), muestra la guía paso a paso clara
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        
        if (isIOS) {
          modalText.innerHTML = "<b>Para instalar en iPhone:</b><br><br>1. Tocá el botón <b>'Compartir'</b> ⎘ abajo en Safari.<br>2. Buscá y elegí <b>'Agregar a inicio'</b> ➕.";
        } else {
          modalText.innerHTML = "<b>¿No aparece 'Instalar' en los 3 puntos? Probá esto:</b><br><br>• Asegurate de no tener la app ya instalada en tu celu.<br>• Tocá los <b>3 puntos (⋮)</b> de Chrome.<br>• Buscá <b>'Agregar a la pantalla principal'</b> o <b>'Instalar aplicación'</b>.<br>• Si usas otro navegador (como Brave o Samsung Internet), busca la opción de descarga en su menú.";
        }
        modal.style.display = 'flex';
      }
    });

    function cerrarModal() {
      modal.style.display = 'none';
    }
  </script>
</body>
</html>
